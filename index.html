<!doctype html><html lang="ro"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Nota Zece</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app. Stat bar on top, scrolling stage in the middle, tabs at the bottom.
   Every question is a card with a band in a banknote colour; the grade is circled in a teacher's red pen. */
:root{
  --bg:#eceef6; --card:#ffffff; --card-2:#f2f3fa; --ink:#1d1b3a; --ink-2:#5b5e80; --line:#d5d8e8;
  --primary:#2447d6; --primary-deep:#16309e; --on-primary:#ffffff;
  --gold:#f2b01e; --gold-deep:#b97800; --on-gold:#3b2a00; --gold-soft:#fdf0c9; --gold-text:#8a5a00;
  --good:#15895a; --good-soft:#dcf3e6; --bad:#cf3340; --bad-soft:#fbe2e4;
  --pen:#d7263d;
  --t-excel:#1b8553; --t-sql:#2b62d9; --t-analiza:#0d7f8c; --t-pbi:#a87400; --t-py:#7446cf; --t-eco:#bf2f5a; --t-biz:#c05a12; --t-cultura:#667818; --t-mate:#3a5179; --t-logica:#9b2d93; --on-band:#ffffff;
  --r0:#6b6f8f; --r1:#2b62d9; --r2:#7446cf; --r3:#a86c00;
  --scrim:rgba(15,17,36,.55); --sky:#bfe3ff; --sky-ink:#1d4a73; --grass:#7ccf8a; --road:#5a6076; --frame:#1d1b3a; --code-bg:#1d1b3a; --code-fg:#eef0ff;
  --shadow:0 1px 0 rgba(29,27,58,.05), 0 12px 26px -16px rgba(29,27,58,.4);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --rad:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1124; --card:#1a1d3b; --card-2:#242851; --ink:#eef0ff; --ink-2:#a6abd0; --line:#32375f;
    --primary:#7f99ff; --primary-deep:#4f69d6; --on-primary:#0b0f2a;
    --gold:#f7c23e; --gold-deep:#a8760a; --on-gold:#3b2a00; --gold-soft:#3a3013; --gold-text:#f7c23e;
    --good:#3fcf8a; --good-soft:#133a2a; --bad:#ff707b; --bad-soft:#47202a;
    --pen:#ff5a6e;
    --t-excel:#1b8553; --t-sql:#2b62d9; --t-analiza:#0d7f8c; --t-pbi:#a87400; --t-py:#7446cf; --t-eco:#bf2f5a; --t-biz:#c05a12; --t-cultura:#667818; --t-mate:#3a5179; --t-logica:#9b2d93; --on-band:#ffffff;
    --r0:#a6abd0; --r1:#86a8ff; --r2:#b79aff; --r3:#f7c23e;
    --scrim:rgba(4,5,14,.7); --sky:#1a2450; --sky-ink:#b9c8f5; --grass:#2f6b45; --road:#2c3044; --frame:#474c88; --code-bg:#0b0d1f; --code-fg:#eef0ff;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 28px -16px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1124; --card:#1a1d3b; --card-2:#242851; --ink:#eef0ff; --ink-2:#a6abd0; --line:#32375f;
  --primary:#7f99ff; --primary-deep:#4f69d6; --on-primary:#0b0f2a;
  --gold:#f7c23e; --gold-deep:#a8760a; --on-gold:#3b2a00; --gold-soft:#3a3013; --gold-text:#f7c23e;
  --good:#3fcf8a; --good-soft:#133a2a; --bad:#ff707b; --bad-soft:#47202a;
  --pen:#ff5a6e;
  --t-excel:#1b8553; --t-sql:#2b62d9; --t-analiza:#0d7f8c; --t-pbi:#a87400; --t-py:#7446cf; --t-eco:#bf2f5a; --t-biz:#c05a12; --t-cultura:#667818; --t-mate:#3a5179; --t-logica:#9b2d93; --on-band:#ffffff;
  --r0:#a6abd0; --r1:#86a8ff; --r2:#b79aff; --r3:#f7c23e;
  --scrim:rgba(4,5,14,.7); --sky:#1a2450; --sky-ink:#b9c8f5; --grass:#2f6b45; --road:#2c3044; --frame:#474c88; --code-bg:#0b0d1f; --code-fg:#eef0ff;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 14px 28px -16px rgba(0,0,0,.85);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.av{display:block;width:100%;height:100%}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;max-width:540px;margin:0 auto;display:flex;flex-direction:column}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* ── bara de sus ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 8px;flex:none}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ten{display:inline-grid;place-items:center;color:var(--pen);border:2.5px solid var(--pen);border-radius:52% 48% 46% 54% / 56% 48% 52% 44%;padding:0 7px 1px;transform:rotate(-7deg);font-size:19px;line-height:1.25}
.stats{display:flex;gap:8px;align-items:center}
.pill{position:relative;display:inline-flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:18px;height:18px;flex:none}
.pill.streak.off{color:var(--ink-2)}
.fly{position:absolute;right:8px;top:100%;font-weight:800;color:var(--gold-text);pointer-events:none;animation:fly .95s ease-out forwards}
@keyframes fly{0%{transform:translateY(6px);opacity:0}20%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.12)}}

/* ── zona principală + taburi ── */
main{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 22px;-webkit-overflow-scrolling:touch}
main > *,.sheet-in > *{flex-shrink:0}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;background:var(--card);border-top:1px solid var(--line);padding-block:6px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:12px;font-weight:600;color:var(--ink-2)}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--primary);background:var(--card-2)}

.h2{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2);font-size:14px}
.panel{background:var(--card);border-radius:var(--rad);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.coin{width:16px;height:16px;flex:none;vertical-align:-3px}
.price{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── butoane ── */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:16px;font-weight:700;font-size:17px;text-align:center;background:var(--primary);color:var(--on-primary);border-bottom:4px solid var(--primary-deep);transition:transform .08s}
.btn:active{transform:translateY(2px);border-bottom-width:2px;margin-top:2px}
.btn.gold{background:var(--gold);color:var(--on-gold);border-bottom-color:var(--gold-deep)}
.btn.ghost{background:var(--card-2);color:var(--ink);border:1.5px solid var(--line);border-bottom-width:4px}
.btn.ghost:active{border-bottom-width:2px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.sm{min-height:42px;font-size:15px;padding:8px 14px;border-radius:13px}
.link{color:var(--primary);font-weight:700;font-size:14px;padding:6px 0}
.row{display:flex;gap:10px;align-items:center}
.row > .grow{flex:1;min-width:0}
.btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}

/* ── acasă ── */
.hero{display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;align-items:center;background:var(--card);border-radius:var(--rad);padding:12px;box-shadow:var(--shadow)}
.stage{aspect-ratio:200/220;border-radius:16px;overflow:hidden;border:2.5px solid var(--frame);background:var(--card-2);max-width:100%}
.who{display:flex;flex-direction:column;gap:5px;min-width:0}
.who h1{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.1;letter-spacing:-.02em;overflow-wrap:anywhere}
.bar{height:10px;border-radius:99px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--primary);border-radius:99px;min-width:4px}
.bar.gold > i{background:var(--gold)}

.play{background:var(--primary);color:var(--on-primary);border-radius:var(--rad);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.play .h2{font-size:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.play .chip{border:1.5px solid color-mix(in srgb, var(--on-primary) 50%, transparent);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px}
.play .chip[aria-pressed="true"]{background:var(--on-primary);color:var(--primary);border-color:var(--on-primary)}
.play .btn small{display:block;font-size:13px;font-weight:600;opacity:.8}
.play .btn{flex-direction:column;gap:0;min-height:62px;font-size:19px;font-family:var(--f-display)}
.play .info{font-size:14px;opacity:.9}

.pips{display:flex;gap:6px}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--on-primary)}
.pip.on{background:var(--good);border-color:var(--good)}
.pip svg{width:14px;height:14px}
.thumb{width:72px;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--frame);flex:none;background:var(--card-2)}

/* ── sesiune ── */
.sess{display:flex;flex-direction:column;gap:10px;flex:1}
.sbar{display:flex;align-items:center;gap:10px}
.x{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px}
.segs{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;min-width:0}
.seg{height:9px;border-radius:99px;background:var(--line)}
.seg.ok{background:var(--good)}.seg.no{background:var(--bad)}.seg.cur{background:var(--ink)}
.combo{font-weight:800;font-size:14px;color:var(--gold-text);white-space:nowrap;min-width:54px;text-align:right}

.qcard{background:var(--card);border-radius:22px;border:2.5px solid var(--frame);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.qcard.in{animation:cardin .28s cubic-bezier(.2,.8,.2,1)}
.qcard.out{animation:cardout .18s ease-in forwards}
@keyframes cardin{from{transform:translateY(46px);opacity:0}}
@keyframes cardout{to{transform:translateY(-46px);opacity:0}}
.band{display:flex;align-items:center;gap:8px;padding:9px 14px;color:var(--on-band);font-weight:700;font-size:14px;background:var(--tc,var(--ink))}
.band .tname{font-family:var(--f-display);font-size:16px;letter-spacing:.01em}
.band .tag{margin-left:auto;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.92}
.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--on-band)}.dots i.f{background:var(--on-band)}
.t-excel{--tc:var(--t-excel)}.t-sql{--tc:var(--t-sql)}.t-analiza{--tc:var(--t-analiza)}.t-pbi{--tc:var(--t-pbi)}.t-py{--tc:var(--t-py)}.t-eco{--tc:var(--t-eco)}.t-biz{--tc:var(--t-biz)}.t-cultura{--tc:var(--t-cultura)}.t-mate{--tc:var(--t-mate)}.t-logica{--tc:var(--t-logica)}
.qcard.is-gold{border-color:var(--gold-deep);box-shadow:0 0 0 4px var(--gold-soft), var(--shadow)}
.goldbar{display:flex;align-items:center;gap:8px;justify-content:center;background:var(--gold);color:var(--on-gold);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}
.qbody{padding:16px 14px 14px;display:flex;flex-direction:column;gap:12px}
.q{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.22;letter-spacing:-.01em;text-wrap:balance}
.code{margin:0;font-family:var(--f-mono);font-size:14.5px;line-height:1.5;background:var(--code-bg);color:var(--code-fg);padding:11px 13px;border-radius:12px;overflow-x:auto;white-space:pre;tab-size:4}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;min-height:52px;border-radius:15px;background:var(--card-2);border:1.5px solid var(--line);border-bottom-width:4px;font-weight:600;font-size:16px;line-height:1.3;transition:transform .08s}
.opt:not([disabled]):active{transform:translateY(2px);border-bottom-width:2px;margin-top:2px}
.opt .key{width:30px;height:30px;border-radius:9px;background:var(--card);border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:14px;color:var(--ink-2);flex:none}
.opt .txt{min-width:0;overflow-wrap:anywhere;flex:1}
.opt.mono .txt{font-family:var(--f-mono);font-size:14px;white-space:pre-wrap}
.opt[disabled]{cursor:default}
.opt.dim{opacity:.5}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.right .key{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--card)}
.expl{border-radius:14px;padding:12px 13px;display:flex;flex-direction:column;gap:4px;animation:cardin .22s ease-out}
.expl.ok{background:var(--good-soft)}.expl.no{background:var(--bad-soft)}
.expl .v{font-family:var(--f-display);font-weight:800;font-size:17px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.expl.ok .v{color:var(--good)}.expl.no .v{color:var(--bad)}
.expl .gain{color:var(--gold-text);font-size:15px;white-space:nowrap}
.expl p{font-size:15px}
.next{position:sticky;bottom:0;padding-block:8px 2px;background:linear-gradient(to top, var(--bg) 70%, transparent);display:flex;flex-direction:column;gap:4px;margin-top:auto}
.next .hint{text-align:center;font-size:12px;color:var(--ink-2)}

/* ── rezultat ── */
.result{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.gradebox{display:flex;align-items:center;gap:18px;padding:6px 4px}
.stamp{flex:none;width:132px;height:132px;display:grid;place-items:center;color:var(--pen);border:5px solid var(--pen);border-radius:50% 46% 52% 48% / 48% 54% 46% 52%;transform:rotate(-8deg);animation:stamp .4s cubic-bezier(.2,1.4,.4,1)}
.stamp b{font-family:var(--f-display);font-weight:800;font-size:68px;line-height:1;letter-spacing:-.04em}
.stamp span{display:block;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;text-align:center;margin-bottom:-6px}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.6);opacity:0}}
.gradebox h1{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.lines{display:flex;flex-direction:column}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15px}
.line b{font-variant-numeric:tabular-nums;white-space:nowrap}
.line.total{border-bottom:0;font-family:var(--f-display);font-size:19px;font-weight:800;padding-top:10px}
.line.total b{color:var(--gold-text)}
.miss{display:flex;flex-direction:column;gap:2px;padding:9px 0;border-bottom:1px dashed var(--line)}
.miss:last-child{border-bottom:0}
.miss .mq{font-weight:600;font-size:15px}
.miss .ma{font-size:14px;color:var(--good);font-weight:600;overflow-wrap:anywhere}

/* ── magazin ── */
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:460px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.item{background:var(--card);border-radius:18px;padding:8px 8px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);border:2px solid transparent;min-width:0}
.item .pic{aspect-ratio:1;border-radius:12px;overflow:hidden;border:2px solid var(--frame);background:var(--card-2)}
.item .nm{font-weight:700;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.item .meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;margin-top:auto}
.item.own{border-color:var(--good)}
.item.goal{border-color:var(--gold)}
.rar{font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.rar.r0{color:var(--r0)}.rar.r1{color:var(--r1)}.rar.r2{color:var(--r2)}.rar.r3{color:var(--r3)}
.owned{color:var(--good);font-weight:700}

/* ── foaie (detaliu obiect) ── */
.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{width:100%;max-width:540px;max-height:92%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:12px;animation:cardin .22s ease-out}
.sheet .big{width:min(62%,230px);aspect-ratio:200/220;border-radius:18px;overflow:hidden;border:2.5px solid var(--frame);align-self:center}

/* ── personaj ── */
.charhead{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:359px){.charhead,.hero{grid-template-columns:104px minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--ink-2)}
.field input{width:100%;min-width:0;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card-2);font-weight:600}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--line);background:var(--c)}
.swb[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--card), 0 0 0 5px var(--primary)}
.wear{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.wear::-webkit-scrollbar{display:none}
.wb{flex:none;width:72px;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:12px;font-weight:600;text-align:center;line-height:1.15}
.wb .pic{width:64px;aspect-ratio:1;border-radius:14px;overflow:hidden;border:2px solid var(--line);background:var(--card-2);display:grid;place-items:center;color:var(--ink-2)}
.wb[aria-pressed="true"] .pic{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary)}
.wb .pic svg.no{width:24px;height:24px}

/* ── progres ── */

/* Banca de întrebări. Regulă: la Q, prima variantă este mereu cea corectă (ordinea se amestecă la afișare).
   Câmpuri: id, t (subiect), l (nivel 1-3), q (întrebare), o (variante), e (explicație), c (cod), m (variante monospace), tf (index corect la Adevărat/Fals).
   ID-urile nu se schimbă niciodată: progresul salvat se leagă de ele. */
const CARDS = [];
function Q(id, t, l, q, o, e, x) { CARDS.push(Object.assign({ id, t, l, q, o, e }, x || {})); }
function TF(id, t, l, q, a, e) { CARDS.push({ id, t, l, q, o: ['Adevărat', 'Fals'], tf: a ? 0 : 1, e }); }

/* ───────── EXCEL ───────── */
Q('ex01','excel',1,'Cu ce caracter începe orice formulă în Excel?',['=','#','@','$'],'Semnul egal îi spune lui Excel că urmează un calcul, nu un text.',{m:1});
Q('ex02','excel',1,'Ce face formula?',['Adună valorile din B2 până la B6','Numără celulele din B2 până la B6','Calculează media din B2 până la B6','Adună doar B2 și B6'],'SUM adună toate numerele din interval. Două puncte (:) înseamnă „de la… până la”.',{c:'=SUM(B2:B6)'});
Q('ex03','excel',1,'Ce înseamnă A1:A10 într-o formulă?',['Toate celulele de la A1 până la A10','Doar celulele A1 și A10','A1 împărțit la A10','Toată coloana A'],'Două puncte definesc un interval: tot ce se află între cele două celule, inclusiv capetele.');
Q('ex04','excel',1,'Ce returnează formula?',['30','90','20','45'],'AVERAGE face media: (10 + 20 + 60) / 3 = 30.',{c:'=AVERAGE(10, 20, 60)',m:1});
Q('ex05','excel',1,'Ce numără COUNT într-un interval?',['Doar celulele care conțin numere','Toate celulele, inclusiv cele goale','Doar celulele cu text','Caracterele din fiecare celulă'],'COUNT ignoră textul și celulele goale. Pentru orice celulă completată folosești COUNTA.');
Q('ex06','excel',1,'Care funcție numără toate celulele completate, fie cu text, fie cu numere?',['COUNTA','COUNT','COUNTBLANK','SUM'],'COUNTA numără tot ce nu e gol. COUNT numără doar numerele, iar COUNTBLANK doar celulele goale.',{m:1});
Q('ex07','excel',1,'Ce returnează formula?',['2','9','4','22'],'MIN returnează cea mai mică valoare. MAX ar fi returnat 9.',{c:'=MIN(4, 9, 2, 7)',m:1});
Q('ex08','excel',1,'Ce returnează formula?',['Da','Nu','TRUE','5'],'Condiția 5>3 este adevărată, deci IF returnează al doilea argument.',{c:'=IF(5>3, "Da", "Nu")',m:1});
Q('ex09','excel',2,'A1 conține 50. Ce returnează formula?',['Admis','Respins','50','O eroare'],'>= înseamnă „mai mare sau egal”. 50 este egal cu 50, deci condiția e adevărată.',{c:'=IF(A1>=50, "Admis", "Respins")'});
Q('ex10','excel',2,'Ce face semnul $ în referința $A$1?',['Fixează referința: rămâne A1 când copiezi formula','Transformă valoarea în monedă','Ascunde celula','Rotunjește la două zecimale'],'Este o referință absolută. Fără $, referința se mută odată cu formula.');
Q('ex11','excel',2,'În C1 ai formula de mai jos. O copiezi în C2. Ce devine?',['=A2*B2','=A1*B1','=B1*C1','=A1*B2'],'Referințele relative coboară un rând odată cu formula.',{c:'=A1*B1',m:1});
Q('ex12','excel',2,'În C1 ai formula de mai jos. O copiezi în C2. Ce devine?',['=A2*$B$1','=A2*$B$2','=A1*$B$1','=$A$2*B1'],'A1 este relativă și devine A2. $B$1 este absolută și rămâne pe loc.',{c:'=A1*$B$1',m:1});
Q('ex13','excel',2,'Ce înseamnă eroarea #DIV/0! ?',['Formula împarte la zero sau la o celulă goală','Coloana este prea îngustă','Numele funcției este scris greșit','Referința nu mai există'],'Excel nu poate împărți la zero. Verifică celula de la numitor.');
Q('ex14','excel',2,'O celulă afișează #####. Care e cauza cea mai frecventă?',['Coloana e prea îngustă pentru valoare','Formula este greșită','Celula este protejată','Valoarea a fost ștearsă'],'Lărgește coloana și valoarea apare. Datele nu sunt pierdute.');
Q('ex15','excel',2,'Când apare eroarea #NAME? ?',['Când Excel nu recunoaște un nume, de exemplu o funcție scrisă greșit','Când împarți la zero','Când valoarea căutată nu există','Când coloana e prea îngustă'],'Exemplu: =SUMM(A1:A5). Verifică ortografia funcției și ghilimelele din jurul textului.');
Q('ex16','excel',2,'VLOOKUP returnează #N/A. Ce înseamnă de obicei?',['Valoarea căutată nu a fost găsită','Ai împărțit la zero','Formula are prea multe argumente','Foaia este protejată'],'N/A = „not available”. Verifică dacă valoarea există exact așa în prima coloană, fără spații în plus.');
Q('ex17','excel',2,'Ce face formula?',['Numără celulele cu valori mai mari de 100','Adună valorile mai mari de 100','Returnează prima valoare peste 100','Verifică dacă toate valorile sunt peste 100'],'COUNTIF numără celulele care respectă o condiție. Pentru adunare ai folosi SUMIF.',{c:'=COUNTIF(A1:A10, ">100")'});
Q('ex18','excel',2,'Care funcție adună doar valorile care respectă o condiție?',['SUMIF','COUNTIF','SUM','AVERAGE'],'SUMIF = SUM + IF: adună doar ce respectă criteriul.',{m:1});
Q('ex19','excel',2,'Ce face formula?',['Adună valorile din C acolo unde în A scrie „Nord”','Numără de câte ori apare „Nord” în A','Adună coloanele A și C','Caută „Nord” în coloana C'],'Argumentele sunt, în ordine: unde caut, ce caut, ce adun.',{c:'=SUMIF(A2:A10, "Nord", C2:C10)'});
Q('ex20','excel',2,'Ce returnează formula?',['3.14','3.1','3.15','3'],'ROUND rotunjește la numărul de zecimale cerut, aici două.',{c:'=ROUND(3.14159, 2)',m:1});
Q('ex21','excel',2,'Ce returnează formula?',['Ex','el','Exc','2'],'LEFT ia primele caractere din stânga, aici două.',{c:'=LEFT("Excel", 2)',m:1});
Q('ex22','excel',2,'Ce returnează formula?',['2026','RO-2','-2026','6202'],'RIGHT ia ultimele caractere din dreapta, aici patru.',{c:'=RIGHT("RO-2026", 4)',m:1});
Q('ex23','excel',2,'Ce returnează formula?',['Ana Pop','AnaPop','Ana & Pop','O eroare'],'& lipește texte. Spațiul dintre ghilimele este și el un text.',{c:'="Ana" & " " & "Pop"',m:1});
Q('ex24','excel',2,'Ce returnează formula?',['4','Date','1','0'],'LEN numără caracterele dintr-un text.',{c:'=LEN("Date")',m:1});
Q('ex25','excel',2,'Ce face funcția TRIM?',['Elimină spațiile în plus dintr-un text','Taie zecimalele unui număr','Șterge rândurile goale','Scurtează textul la 10 caractere'],'TRIM scoate spațiile de la început și de la sfârșit și lasă un singur spațiu între cuvinte. Foarte utilă la curățarea datelor.');
Q('ex26','excel',2,'Ce returnează =TODAY() ?',['Data curentă','Data și ora curentă','Ziua săptămânii','Anul curent'],'TODAY dă doar data. Pentru dată și oră folosești NOW.');
Q('ex27','excel',2,'Ce returnează formula?',['14','20','24','9'],'Înmulțirea se face înaintea adunării: 3*4 = 12, apoi 2 + 12 = 14.',{c:'=2+3*4',m:1});
Q('ex28','excel',2,'Ianuarie: A1 = 200. Februarie: B1 = 250. Care formulă calculează creșterea procentuală?',['=(B1-A1)/A1','=B1-A1','=A1/B1','=(B1-A1)/B1'],'Diferența se împarte la valoarea de pornire: (250 − 200) / 200 = 0.25, adică 25%.',{m:1});
Q('ex29','excel',2,'O celulă conține 0.12. Cum o afișezi corect ca 12%?',['Aplici formatul Percentage (%)','Scrii manual „12%” ca text','Înmulțești cu 100 și atât','Schimbi fontul'],'Formatul schimbă doar afișarea. Valoarea rămâne 0.12 și poate fi folosită în calcule.');
Q('ex30','excel',2,'Ce face un PivotTable?',['Rezumă date multe: grupează și calculează totaluri fără formule','Rotește foaia cu 90 de grade','Șterge duplicatele','Protejează datele cu parolă'],'Tragi câmpuri în rânduri, coloane și valori și primești rezumatul. Este unealta de bază a unui analist în Excel.');
Q('ex31','excel',2,'Ai vânzările pe 12 luni și vrei să arăți evoluția. Ce grafic alegi?',['Grafic cu linii','Grafic plăcintă (pie)','Grafic radar','Un tabel colorat'],'Linia arată cel mai clar o tendință în timp.');
Q('ex32','excel',2,'Vrei să compari vânzările a 6 regiuni între ele. Ce grafic e cel mai clar?',['Grafic cu bare sau coloane','Grafic cu linii','Grafic plăcintă (pie)','Grafic cu puncte (scatter)'],'Barele se compară ușor din ochi. La plăcintă, feliile apropiate ca mărime se disting greu.');
Q('ex33','excel',2,'Ce face Conditional Formatting (formatarea condiționată)?',['Schimbă automat aspectul celulelor în funcție de valoare','Blochează celulele la editare','Sortează datele','Transformă formulele în valori'],'Exemplu: colorezi automat cu roșu toate vânzările sub țintă.');
Q('ex34','excel',2,'Ce face Freeze Panes?',['Ține antetul vizibil când derulezi','Oprește recalcularea formulelor','Blochează editarea foii','Salvează o copie a fișierului'],'Îngheți primul rând sau prima coloană ca să vezi mereu ce reprezintă datele.');
Q('ex35','excel',2,'Ce face Remove Duplicates?',['Șterge rândurile care se repetă','Doar evidențiază duplicatele','Combină două tabele','Șterge celulele goale'],'Atenție: șterge efectiv rândurile. Lucrează pe o copie dacă nu ești sigur.');
Q('ex36','excel',2,'De ce ai transforma un interval în tabel (Ctrl+T)?',['Filtrele, formatarea și formulele se extind automat la rândurile noi','Datele nu mai pot fi modificate','Fișierul se salvează singur','Se creează automat un grafic'],'Un tabel Excel crește odată cu datele, iar formulele și graficele legate de el se actualizează.');
Q('ex37','excel',1,'Ce scurtătură anulează ultima acțiune?',['Ctrl+Z','Ctrl+Y','Ctrl+S','Ctrl+X'],'Ctrl+Z = Undo. Ctrl+Y reface acțiunea anulată.',{m:1});
Q('ex38','excel',2,'Ce face un filtru aplicat pe o coloană?',['Ascunde temporar rândurile care nu respectă criteriul','Șterge rândurile care nu respectă criteriul','Mută rândurile pe altă foaie','Colorează rândurile găsite'],'Datele ascunse rămân în foaie. Când scoți filtrul, reapar.');
Q('ex39','excel',2,'Ce face Paste Special → Values?',['Lipește doar rezultatele, fără formule','Lipește doar formatarea','Lipește celulele ca imagine','Lipește formulele fără rezultate'],'Util când vrei să „îngheți” un rezultat sau să trimiți date fără formulele din spate.');
Q('ex40','excel',2,'Ce face Text to Columns?',['Împarte conținutul unei coloane în mai multe, după un separator','Unește mai multe coloane într-una','Transformă textul în majuscule','Rotește textul în celulă'],'Exemplu: „Pop, Ana” devine două coloane, „Pop” și „Ana”.');
Q('ex41','excel',2,'Ce returnează formula?',['cure','Bucu','ucur','ești'],'MID ia caractere din mijloc: pornește de la al 3-lea caracter și ia 4.',{c:'=MID("București", 3, 4)',m:1});
Q('ex42','excel',2,'Ce face =COUNTBLANK(A1:A10) ?',['Numără celulele goale din interval','Șterge celulele goale','Numără celulele cu text','Completează celulele goale cu zero'],'Te ajută să vezi rapid câte valori lipsesc dintr-o coloană.');
Q('ex43','excel',2,'Ce este un „named range” (interval denumit)?',['Un nume dat unui interval, pe care îl folosești în formule','O foaie redenumită','Un tabel protejat cu parolă','Un comentariu atașat unei celule'],'=SUM(Vanzari) se citește mai ușor decât =SUM(B2:B200).');
Q('ex44','excel',3,'Ce face formula?',['Caută E2 în prima coloană din A2:C100 și returnează valoarea din a 3-a coloană','Caută E2 în coloana C și returnează valoarea din A','Returnează al 3-lea rând din tabel','Verifică dacă E2 este FALSE'],'FALSE la final cere potrivire exactă. Aproape întotdeauna asta vrei.',{c:'=VLOOKUP(E2, A2:C100, 3, FALSE)'});
Q('ex45','excel',3,'La VLOOKUP, unde trebuie să se afle valoarea căutată?',['În prima coloană a intervalului selectat','În ultima coloană a intervalului','În orice coloană','Obligatoriu în coloana A a foii'],'VLOOKUP caută doar în prima coloană a intervalului și returnează ceva din dreapta ei.');
Q('ex46','excel',3,'Ce avantaj are XLOOKUP față de VLOOKUP?',['Poate returna valori și din stânga coloanei de căutare','Funcționează doar cu numere','Nu are nevoie de argumente','Există în toate versiunile vechi de Excel'],'La XLOOKUP alegi separat coloana de căutare și coloana de rezultat. Există doar în Excel 2021 și Microsoft 365.');
Q('ex47','excel',3,'Ce face formula?',['Returnează 0 dacă împărțirea dă eroare, altfel rezultatul','Returnează întotdeauna 0','Șterge eroarea din B1','Numără erorile din foaie'],'IFERROR prinde orice eroare și pune în loc valoarea aleasă de tine.',{c:'=IFERROR(A1/B1, 0)'});
Q('ex48','excel',3,'A1 = 5 și B1 = -2. Ce returnează formula?',['Verifică','OK','TRUE','O eroare'],'AND cere ca ambele condiții să fie adevărate. B1 nu este mai mare ca 0.',{c:'=IF(AND(A1>0, B1>0), "OK", "Verifică")'});
Q('ex49','excel',3,'A1 = 5 și B1 = -2. Ce returnează formula?',['OK','Verifică','FALSE','O eroare'],'La OR ajunge ca una dintre condiții să fie adevărată. A1 este mai mare ca 0.',{c:'=IF(OR(A1>0, B1>0), "OK", "Verifică")'});
Q('ex50','excel',3,'Ce face formula?',['Numără rândurile unde A este „Nord” și B este peste 100','Numără rândurile unde A este „Nord” sau B este peste 100','Adună valorile din B pentru „Nord”','Numără separat „Nord” și valorile peste 100'],'COUNTIFS aplică toate criteriile simultan: un rând se numără doar dacă le respectă pe toate.',{c:'=COUNTIFS(A:A, "Nord", B:B, ">100")'});
Q('ex51','excel',3,'Care e diferența dintre A$1 și $A1?',['A$1 fixează rândul, $A1 fixează coloana','A$1 fixează coloana, $A1 fixează rândul','Nu există nicio diferență','A$1 este tratat ca text'],'$ fixează ce urmează imediat după el: litera (coloana) sau numărul (rândul).');
Q('ex52','excel',3,'Ce returnează =UNIQUE(A2:A100) ?',['Lista valorilor distincte, fără repetări','Numărul de valori unice','TRUE dacă toate valorile sunt unice','Șterge duplicatele din foaie'],'UNIQUE nu modifică datele sursă. Afișează lista într-o zonă nouă.');
Q('ex53','excel',3,'A1 = „Ana”, A2 este gol, A3 = „Dan”. Ce returnează formula?',['Ana, Dan','Ana, , Dan','AnaDan','Ana Dan'],'Primul argument este separatorul. TRUE îi spune să sară peste celulele goale.',{c:'=TEXTJOIN(", ", TRUE, A1:A3)',m:1});
Q('ex54','excel',3,'Scrii formula de mai jos și Excel o respinge, deși e corectă. Care e cauza probabilă?',['Excelul tău desparte argumentele cu „;” în loc de „,”','Funcția IF nu există în versiunea ta','Formulele se scriu cu litere mici','Celula A1 este goală'],'Cu setări regionale românești, virgula este separator zecimal, deci scrii =IF(A1>10;"Da";"Nu"). La examenele Microsoft se folosește varianta cu virgulă.',{c:'=IF(A1>10,"Da","Nu")'});

/* ───────── SQL ───────── */
Q('sq01','sql',1,'La ce folosește limbajul SQL?',['La lucrul cu date din baze de date','La crearea de prezentări','La editarea de imagini','La formatarea documentelor'],'Cu SQL citești, filtrezi și combini date din tabelele unei baze de date.');
Q('sq02','sql',1,'Ce face comanda SELECT?',['Citește date din tabele','Șterge date','Creează un tabel nou','Modifică date existente'],'SELECT doar citește. Nu schimbă nimic în baza de date.');
Q('sq03','sql',1,'Ce înseamnă * în interogare?',['Toate coloanele','Toate tabelele','Doar primul rând','Înmulțire'],'SELECT * aduce toate coloanele din tabel.',{c:'SELECT * FROM clienti;'});
Q('sq04','sql',1,'Care clauză filtrează rândurile?',['WHERE','ORDER BY','GROUP BY','FROM'],'WHERE păstrează doar rândurile care respectă condiția.',{m:1});
Q('sq05','sql',1,'Ce returnează interogarea?',['Numele clienților din Cluj','Toate coloanele pentru clienții din Cluj','Numărul clienților din Cluj','Orașele care se numesc Cluj'],'SELECT alege coloana (nume), iar WHERE alege rândurile (oraș = Cluj).',{c:`SELECT nume FROM clienti\nWHERE oras = 'Cluj';`});
Q('sq06','sql',1,'Ce face ORDER BY pret DESC?',['Sortează de la cel mai mare preț la cel mai mic','Sortează de la cel mai mic preț la cel mai mare','Șterge coloana pret','Afișează descrierea prețului'],'DESC = descrescător. ASC = crescător.');
Q('sq07','sql',1,'Scrii ORDER BY pret, fără ASC sau DESC. Cum se sortează?',['Crescător','Descrescător','Aleatoriu','Primești o eroare'],'ASC este varianta implicită.');
Q('sq08','sql',2,'Ce returnează interogarea?',['Numărul total de rânduri din tabelul comenzi','Suma valorilor din comenzi','Numărul de coloane din comenzi','Ultima comandă'],'COUNT(*) numără rândurile.',{c:'SELECT COUNT(*) FROM comenzi;'});
Q('sq09','sql',2,'Ce face DISTINCT?',['Elimină rândurile duplicate din rezultat','Sortează rezultatul','Șterge duplicatele din tabel','Numără valorile'],'SELECT DISTINCT oras FROM clienti afișează fiecare oraș o singură dată. Tabelul rămâne neschimbat.');
Q('sq10','sql',2,'Ce returnează interogarea?',['Câți clienți sunt în fiecare oraș','Numărul total de clienți','Lista orașelor, fără duplicate','Clienții sortați după oraș'],'GROUP BY face câte un grup pentru fiecare oraș, iar COUNT(*) numără rândurile din fiecare grup.',{c:'SELECT oras, COUNT(*)\nFROM clienti\nGROUP BY oras;'});
Q('sq11','sql',2,'Care clauză filtrează grupurile, după GROUP BY?',['HAVING','WHERE','ORDER BY','LIMIT'],'WHERE filtrează rânduri înainte de grupare. HAVING filtrează grupurile după ce au fost calculate.',{m:1});
Q('sq12','sql',2,'Vrei doar orașele cu peste 10 clienți. Ce adaugi după GROUP BY oras?',['HAVING COUNT(*) > 10','WHERE COUNT(*) > 10','ORDER BY 10','LIMIT 10'],'Funcțiile de agregare precum COUNT nu pot fi folosite în WHERE. Condițiile pe grupuri se pun în HAVING.',{m:1});
Q('sq13','sql',2,'Ce face LIMIT 5 la finalul unei interogări?',['Returnează doar primele 5 rânduri','Returnează doar 5 coloane','Sare peste primele 5 rânduri','Oprește interogarea după 5 secunde'],'LIMIT există în MySQL, PostgreSQL și SQLite. În SQL Server scrii SELECT TOP 5.');
TF('sq14','sql',2,'WHERE pret BETWEEN 10 AND 20 include și valorile 10 și 20.',true,'BETWEEN include ambele capete ale intervalului.');
Q('sq15','sql',2,'Ce nume găsește condiția?',['Numele care încep cu A','Numele care conțin A','Numele care se termină cu A','Doar numele „A%”'],'% ține locul oricâtor caractere. Aici vine după A, deci numele încep cu A.',{c:`WHERE nume LIKE 'A%'`});
Q('sq16','sql',2,'Ce nume găsește condiția?',['Numele care se termină cu „escu”','Numele care încep cu „escu”','Doar numele „escu”','Numele fără „escu”'],'% la început înseamnă „orice înainte”, deci contează doar finalul.',{c:`WHERE nume LIKE '%escu'`});
Q('sq17','sql',2,'Cum găsești corect clienții fără număr de telefon?',['WHERE telefon IS NULL','WHERE telefon = NULL','WHERE telefon = 0','WHERE telefon = "lipsă"'],'NULL înseamnă „valoare necunoscută” și nu se compară cu =. Se folosește IS NULL sau IS NOT NULL.',{m:1});
Q('sq18','sql',2,'Ce este o cheie primară (PRIMARY KEY)?',['Coloana care identifică unic fiecare rând','Prima coloană din tabel','Parola bazei de date','Cea mai mare valoare dintr-o coloană'],'Exemplu: id_client. Nu se repetă și nu poate fi NULL.');
Q('sq19','sql',2,'Ce este o cheie străină (FOREIGN KEY)?',['O coloană care face legătura cu cheia primară din alt tabel','O coloană cu text în altă limbă','O copie de siguranță a cheii primare','O coloană ascunsă'],'Exemplu: comenzi.id_client arată spre clienti.id_client. Pe ea se fac JOIN-urile.');
Q('sq20','sql',2,'Ce returnează un INNER JOIN?',['Doar rândurile care au pereche în ambele tabele','Toate rândurile din ambele tabele','Toate rândurile din tabelul din stânga','Doar rândurile fără pereche'],'Un client fără nicio comandă nu apare într-un INNER JOIN între clienți și comenzi.');
Q('sq21','sql',3,'Ce returnează un LEFT JOIN?',['Toate rândurile din stânga, plus perechile din dreapta acolo unde există','Doar rândurile cu pereche în ambele tabele','Toate rândurile din tabelul din dreapta','Doar rândurile din stânga care nu au pereche'],'Unde nu există pereche, coloanele din tabelul din dreapta apar ca NULL.');
Q('sq22','sql',3,'Vrei clienții care nu au nicio comandă. Care abordare funcționează?',['LEFT JOIN cu comenzi, apoi WHERE comenzi.id IS NULL','INNER JOIN cu comenzi','WHERE comenzi = 0','GROUP BY client'],'LEFT JOIN păstrează toți clienții. Cei fără comenzi au NULL în coloanele din comenzi, iar pe ei îi alegi cu IS NULL.');
Q('sq23','sql',2,'Ce returnează interogarea?',['Valoarea totală a comenzilor din 2026','Numărul comenzilor din 2026','Cea mai mare comandă din 2026','Toate comenzile din 2026'],'SUM adună valorile din coloană pentru rândurile rămase după WHERE.',{c:'SELECT SUM(valoare)\nFROM comenzi\nWHERE an = 2026;'});

Q('ec12','eco',2,'Care e diferența dintre PIB-ul nominal și PIB-ul real?',['PIB-ul real este ajustat cu inflația','PIB-ul real include economia subterană','PIB-ul nominal este calculat în euro','Nu există nicio diferență'],'PIB-ul nominal poate crește doar pentru că au crescut prețurile. Cel real arată dacă s-a produs efectiv mai mult.');
Q('ec13','eco',2,'Care este banca centrală a României?',['Banca Națională a României (BNR)','Banca Comercială Română','Trezoreria Statului','Banca Europeană de Investiții'],'BNR emite moneda națională și conduce politica monetară.');
Q('ec14','eco',2,'Care este obiectivul principal al BNR?',['Stabilitatea prețurilor','Creșterea profitului băncilor','Finanțarea guvernului','Creșterea exporturilor'],'Adică o inflație scăzută și previzibilă.');
Q('ec15','eco',2,'Banca centrală crește dobânda de politică monetară. Ce se întâmplă de obicei cu creditele?',['Devin mai scumpe','Devin mai ieftine','Nu sunt afectate','Sunt interzise'],'Băncile se împrumută mai scump și transmit costul mai departe către clienți.');
Q('ec16','eco',2,'De ce cresc băncile centrale dobânzile când inflația e mare?',['Ca să tempereze creditarea și consumul','Ca să crească prețurile','Ca să tipărească mai mulți bani','Ca să scadă salariile'],'Când creditele sunt scumpe, oamenii și firmele cheltuiesc mai puțin, iar presiunea pe prețuri scade.');
Q('ec17','eco',2,'Ce este politica fiscală?',['Deciziile guvernului despre taxe și cheltuieli publice','Deciziile băncii centrale despre dobânzi','Regulile de funcționare a bursei','Politica de prețuri a firmelor'],'Politica monetară ține de banca centrală. Politica fiscală ține de guvern.');
Q('ec18','eco',2,'Ce este deficitul bugetar?',['Statul cheltuiește într-un an mai mult decât încasează','Statul încasează mai mult decât cheltuiește','Totalul datoriilor statului','Importurile depășesc exporturile'],'Diferența se acoperă de obicei prin împrumuturi.');
Q('ec19','eco',2,'Ce este datoria publică?',['Totalul sumelor datorate de stat, adunate în timp','Deficitul dintr-un singur an','Datoriile populației la bănci','Datoriile firmelor private'],'Deficitul este „cât ai cheltuit în plus anul acesta”. Datoria este „cât datorezi în total”.');
Q('ec20','eco',2,'Ce fel de impozit este TVA?',['Un impozit indirect pe consum, inclus în preț','Un impozit pe salariu','Un impozit pe profitul firmelor','O taxă vamală'],'Îl plătește cumpărătorul final, de fiecare dată când cumpără ceva.');
Q('ec21','eco',2,'Ce este salariul net?',['Suma care îți rămâne după contribuții și impozit','Salariul trecut în contract, înainte de taxe','Salariul plus bonusurile','Costul total al angajatorului'],'Brutul este suma din contract. Netul este ce îți intră efectiv în cont.');
Q('ec22','eco',2,'Să zicem că euro urcă de la 5,00 la 5,10 lei. Ce s-a întâmplat cu leul?',['S-a depreciat','S-a apreciat','A rămas la fel','A fost scos din circulație'],'Ai nevoie de mai mulți lei pentru același euro, deci leul valorează mai puțin.');
Q('ec23','eco',3,'Leul se depreciază față de euro. Cine este avantajat?',['Exportatorii','Importatorii','Cei cu rate în euro','Turiștii români în străinătate'],'Exportatorii încasează euro, care valorează mai mulți lei. Importurile și ratele în euro devin mai scumpe.');
Q('ec24','eco',2,'Ce înseamnă că o țară are deficit comercial?',['Importă mai mult decât exportă','Exportă mai mult decât importă','Are inflație mare','Are șomaj ridicat'],'Balanța comercială = exporturi − importuri. Când rezultatul e negativ, vorbim de deficit.');
Q('ec25','eco',1,'Ce este dobânda?',['Prețul plătit pentru folosirea unor bani împrumutați','O taxă plătită statului','Un comision la retragerea de numerar','Profitul unei firme'],'O plătești la un credit și o primești la un depozit.');
Q('ec26','eco',2,'Împrumuți 1.000 de lei cu dobândă simplă de 10% pe an. Câtă dobândă plătești în 2 ani?',['200 de lei','100 de lei','210 lei','20 de lei'],'Dobânda simplă se calculează mereu la suma inițială: 100 de lei pe an, timp de 2 ani.');
Q('ec27','eco',3,'Depui 1.000 de lei cu 10% pe an, iar dobânda se adaugă la sumă în fiecare an. Cât ai după 2 ani?',['1.210 lei','1.200 de lei','1.100 de lei','1.020 de lei'],'Anul 1: 1.100. Anul 2: 10% din 1.100 = 110, deci 1.210. Aceasta este dobânda compusă.');
Q('ec28','eco',3,'După „regula lui 72”, în cât timp se dublează o sumă investită cu 6% pe an?',['În aproximativ 12 ani','În aproximativ 6 ani','În aproximativ 72 de ani','În aproximativ 17 ani'],'72 / 6 = 12. Este o estimare rapidă pentru dobânda compusă.');
Q('ec29','eco',2,'Depozitul tău are dobândă de 5% pe an, iar inflația este 8%. Ce se întâmplă cu puterea ta de cumpărare?',['Scade cu aproximativ 3%','Crește cu 5%','Crește cu 13%','Rămâne la fel'],'Dobânda reală ≈ dobânda nominală − inflația = 5% − 8% = −3%.');
Q('ec30','eco',3,'Salariul tău crește cu 5%, iar prețurile cresc cu 8%. Ce s-a întâmplat cu salariul tău real?',['A scăzut cu aproximativ 3%','A crescut cu 5%','A crescut cu 13%','A rămas la fel'],'Salariul real arată cât poți cumpăra efectiv. Dacă prețurile cresc mai repede decât salariul, cumperi mai puțin.');
Q('ec31','eco',2,'Ce este o acțiune?',['O parte din proprietatea unei companii','Un împrumut acordat unei companii','Un depozit bancar','O poliță de asigurare'],'Dacă firma merge bine, acțiunea se poate scumpi și poate aduce dividende.');
Q('ec32','eco',2,'Ce este o obligațiune?',['Un împrumut pe care îl dai unui stat sau unei companii, în schimbul unei dobânzi','O parte din proprietatea unei companii','Un cont curent','O taxă obligatorie'],'Emitentul îți plătește dobândă și îți returnează suma la scadență.');
Q('ec33','eco',2,'Ce este un dividend?',['Partea din profit pe care o companie o distribuie acționarilor','Dobânda la un credit','Un comision de tranzacționare','O taxă pe câștiguri'],'Nu toate companiile plătesc dividende. Unele reinvestesc tot profitul.');
Q('ec34','eco',2,'Ce înseamnă diversificarea?',['Împarți banii între mai multe investiții ca să reduci riscul','Investești totul într-o singură companie','Ții toți banii în numerar','Schimbi banca în fiecare an'],'Dacă o investiție merge prost, celelalte pot compensa.');
Q('ec35','eco',2,'Care este legătura obișnuită dintre risc și randament?',['Un randament potențial mai mare vine cu un risc mai mare','Riscul mare garantează un câștig mare','Nu există nicio legătură','Randamentul mare înseamnă risc mic'],'Dacă cineva îți promite câștig mare fără risc, e un semnal de alarmă.');
Q('ec36','eco',2,'Ce este bursa de valori?',['O piață unde se cumpără și se vând acțiuni și alte titluri','O bancă de stat','Un birou de schimb valutar','Un fond de pensii'],'În România, aceasta este Bursa de Valori București (BVB).');
Q('ec37','eco',2,'Ce este un indice bursier, cum ar fi BET?',['Un indicator care urmărește evoluția unui grup de acțiuni','Prețul unei singure acțiuni','Dobânda de referință','Cursul leu–euro'],'BET urmărește cele mai tranzacționate companii de la Bursa de Valori București.');
Q('ec38','eco',3,'Ce înseamnă că un activ este lichid?',['Poate fi transformat rapid în bani, fără pierdere mare de valoare','Își schimbă des prețul','Aduce dobândă mare','Este garantat de stat'],'Numerarul este cel mai lichid. Un apartament este mult mai puțin lichid.');
Q('ec39','eco',2,'Ce este un monopol?',['O piață cu un singur vânzător','O piață cu foarte mulți vânzători','O piață cu un singur cumpărător','O piață fără reguli'],'Fără concurență, vânzătorul poate impune prețuri mai mari.');
Q('ec40','eco',2,'Ce este un oligopol?',['O piață dominată de câțiva vânzători mari','O piață cu un singur vânzător','O piață cu mii de firme mici','O piață controlată de stat'],'Exemple tipice: telefonia mobilă sau companiile aeriene.');
Q('ec41','eco',2,'Ce efect are de obicei concurența asupra consumatorilor?',['Prețuri mai mici și calitate mai bună','Prețuri mai mari','Mai puține produse','Niciun efect'],'Firmele se luptă pentru clienți prin preț, calitate și inovație.');
Q('ec42','eco',3,'Cererea pentru un produs este inelastică. Ce înseamnă?',['Cantitatea cerută se schimbă puțin când se schimbă prețul','Cantitatea cerută se schimbă mult când se schimbă prețul','Prețul nu se poate schimba','Nimeni nu cumpără produsul'],'Exemple: medicamentele sau benzina pe termen scurt. Oamenii le cumpără chiar dacă se scumpesc.');
Q('ec43','eco',3,'Prețul crește cu 10%, iar cantitatea cerută scade cu 20%. Cum este cererea?',['Elastică','Inelastică','Unitară','Perfect inelastică'],'Elasticitatea = 20% / 10% = 2. Peste 1 înseamnă că cererea reacționează puternic la preț.');
Q('ec44','eco',2,'Untul și margarina sunt bunuri substituibile. Untul se scumpește. Ce se întâmplă cu cererea de margarină?',['Crește','Scade','Rămâne la fel','Dispare'],'O parte dintre cumpărători trec la alternativa mai ieftină.');
Q('ec45','eco',2,'Imprimantele și cartușele sunt bunuri complementare. Imprimantele se ieftinesc. Ce se întâmplă cu cererea de cartușe?',['Crește','Scade','Rămâne la fel','Depinde doar de prețul cartușelor'],'Se vând mai multe imprimante, deci e nevoie de mai multe cartușe.');
Q('ec46','eco',2,'Ce este prețul de echilibru?',['Prețul la care cantitatea cerută este egală cu cea oferită','Cel mai mic preț posibil','Prețul stabilit de stat','Prețul mediu din ultimul an'],'La acest preț nu rămâne nici marfă nevândută, nici cumpărători fără marfă.');
Q('ec47','eco',3,'Statul plafonează un preț sub nivelul de echilibru. Care este efectul probabil?',['Penurie: cererea depășește oferta','Surplus de produse','Niciun efect','Calitate mai bună'],'La un preț mic vor să cumpere mai mulți, dar producătorii oferă mai puțin.');
Q('ec48','eco',2,'Ce este o subvenție?',['Un ajutor financiar dat de stat unui sector sau unui produs','O taxă pe importuri','O amendă','Un credit bancar'],'Exemplu: subvențiile pentru agricultură.');
Q('ec49','eco',2,'Ce este o taxă vamală?',['O taxă aplicată produselor importate','O taxă pe salariu','O taxă pe proprietate','Un comision bancar'],'Scumpește produsele din import și îi protejează pe producătorii locali. Consumatorii plătesc însă mai mult.');
Q('ec50','eco',3,'Ce spune principiul avantajului comparativ?',['O țară câștigă dacă se specializează în ce produce cu cel mai mic cost de oportunitate','O țară ar trebui să producă singură tot ce consumă','Doar țările bogate câștigă din comerț','Importurile sunt întotdeauna dăunătoare'],'De aceea comerțul poate fi avantajos pentru ambele părți, chiar dacă una este mai eficientă la toate.');
Q('ec51','eco',2,'O fabrică poluează râul din care beau apă oamenii din zonă. Cum se numește acest efect în economie?',['Externalitate negativă','Cost fix','Inflație','Monopol'],'Este un cost suportat de alții decât cei care produc sau cumpără produsul.');
Q('ec52','eco',3,'De ce este iluminatul stradal un „bun public”?',['Nimeni nu poate fi exclus și folosirea de către unul nu îl împiedică pe altul','Pentru că este gratuit de produs','Pentru că aparține unei firme private','Pentru că se vinde la bursă'],'Astfel de bunuri sunt de obicei finanțate din taxe, pentru că piața nu le oferă singură.');
Q('ec53','eco',2,'Cum se formează prețurile într-o economie de piață?',['Prin cerere și ofertă','Prin decizia guvernului','Prin tragere la sorți','Sunt fixe prin lege'],'Într-o economie planificată, statul decide ce se produce și la ce preț.');
Q('ec54','eco',2,'Care sunt factorii de producție clasici?',['Munca, capitalul și resursele naturale','Banii, băncile și bursa','Importul și exportul','Cererea și oferta'],'Mulți economiști adaugă și un al patrulea factor: antreprenoriatul.');
Q('ec55','eco',2,'Ce este productivitatea muncii?',['Cât se produce într-o oră de muncă','Câte ore se lucrează pe zi','Câți angajați are o firmă','Cât de mare este salariul'],'Pe termen lung, salariile pot crește sustenabil doar dacă crește și productivitatea.');
Q('ec56','eco',2,'Care este problema de bază a economiei?',['Resursele sunt limitate, iar nevoile sunt nelimitate','Banii sunt prea puțini','Prețurile sunt prea mari','Există prea multe firme'],'Se numește raritate. Din cauza ei trebuie să alegem mereu.');
Q('ec57','eco',3,'Ce este stagflația?',['Inflație mare împreună cu creștere economică slabă și șomaj ridicat','Scăderea prețurilor','Creștere economică rapidă','Un curs valutar stabil'],'Este greu de combătut: măsurile care reduc inflația pot frâna și mai mult economia.');
Q('ec58','eco',3,'Ce este hiperinflația?',['O inflație extrem de mare, scăpată de sub control','O inflație de 5% pe an','O scădere bruscă a prețurilor','O creștere a salariilor'],'Un prag folosit des: peste 50% pe lună. Banii își pierd valoarea de la o zi la alta.');
Q('ec59','eco',2,'Cum se măsoară de obicei inflația?',['Prin Indicele Prețurilor de Consum (IPC)','Prin PIB','Prin rata șomajului','Prin cursul valutar'],'IPC urmărește prețul unui „coș” de bunuri și servicii cumpărate de o gospodărie obișnuită.');
Q('ec60','eco',2,'Din ce câștigă în principal o bancă comercială?',['Din diferența dintre dobânda la credite și cea la depozite','Din tipărirea de bani','Din taxele plătite de stat','Din vânzarea de aur'],'Banca plătește o dobândă mică la depozite și încasează una mai mare la credite.');
Q('ec61','eco',2,'Ce arată DAE (dobânda anuală efectivă)?',['Costul total al unui credit pe an, cu tot cu comisioane','Doar dobânda, fără comisioane','Dobânda la depozite','Rata inflației'],'Când compari două credite, compari DAE, nu doar dobânda.');
Q('ec62','eco',3,'Ce este ROBOR?',['Dobânda medie la care băncile din România se împrumută între ele în lei','Dobânda la depozitele populației','Cursul oficial leu–euro','Rata inflației'],'A fost multă vreme reperul pentru creditele cu dobândă variabilă. Pentru creditele mai noi ale persoanelor fizice se folosește IRCC.');
Q('ec63','eco',2,'Ce este un fond de urgență?',['Bani puși deoparte pentru cheltuieli neprevăzute','Un credit de la bancă','Un fond de investiții la bursă','O asigurare de viață'],'Recomandarea obișnuită: cheltuielile tale pe 3 până la 6 luni, ținute într-un loc sigur și ușor de accesat.');
Q('ec64','eco',2,'Care e diferența dintre un card de debit și unul de credit?',['Cu debitul cheltui banii tăi, cu creditul banii băncii','Nu există nicio diferență','Cardul de credit nu are dobândă niciodată','Cardul de debit funcționează doar la bancomat'],'Banii cheltuiți de pe cardul de credit trebuie returnați. Dacă întârzii, plătești dobândă mare.');
Q('ec65','eco',2,'Ce înseamnă „cotă unică” de impozitare?',['Același procent de impozit pentru toate veniturile','Aceeași sumă fixă pentru toți','Impozit doar pentru cei bogați','Impozit doar pe consum'],'La impozitul progresiv, procentul crește odată cu venitul.');
Q('ec66','eco',3,'Cumperi o acțiune cu 50 de lei, primești 2 lei dividend și o vinzi cu 60 de lei. Care e randamentul total?',['24%','20%','12%','4%'],'Câștig total = 10 lei din preț + 2 lei dividend = 12 lei. 12 / 50 = 24%.');
Q('ec67','eco',3,'Ce este o bulă speculativă?',['Prețuri urcate mult peste valoarea reală, urmate de obicei de o prăbușire','O creștere lentă și stabilă a prețurilor','Un tip de obligațiune','O taxă pe tranzacții'],'Oamenii cumpără doar pentru că se așteaptă ca prețul să mai crească.');
Q('ec68','eco',2,'Ce înseamnă o piață „bear”?',['O perioadă lungă de scădere a prețurilor la bursă','O perioadă lungă de creștere a prețurilor','O piață închisă','O piață fără tranzacții'],'Opusul este piața „bull”, cu prețuri în creștere.');
Q('ec69','eco',2,'Ce este un ETF?',['Un fond tranzacționat la bursă, care urmărește de obicei un indice','Un depozit bancar la termen','Un tip de credit','O criptomonedă'],'Cu o singură cumpărare deții bucăți mici din multe companii, deci ai diversificare din start.');
Q('ec70','eco',2,'Ce este Banca Centrală Europeană (BCE)?',['Banca centrală a țărilor care folosesc euro','O bancă comercială din Germania','Bugetul Uniunii Europene','Bursa europeană'],'BCE stabilește dobânzile pentru zona euro, așa cum face BNR pentru leu.');
Q('ec71','eco',2,'Ce este un venit pasiv?',['Un venit care nu depinde direct de orele lucrate','Salariul lunar','Un bonus de performanță','O bursă de studii'],'Exemple: chirii, dividende, dobânzi.');
Q('ec72','eco',2,'Cum îți calculezi averea netă?',['Ce deții minus ce datorezi','Venitul lunar înmulțit cu 12','Totalul din contul curent','Valoarea casei'],'Active (bani, investiții, bunuri) minus datorii (credite, rate).');
Q('ec73','eco',2,'Ce propune regula de buget 50/30/20?',['50% nevoi, 30% dorințe, 20% economii','50% economii, 30% nevoi, 20% dorințe','50% chirie, 30% mâncare, 20% transport','50% investiții, 30% taxe, 20% cheltuieli'],'Este un punct de pornire simplu pentru împărțirea venitului lunar.');
Q('ec74','eco',3,'Ce este costul marginal?',['Costul producerii unei unități în plus','Costul mediu pe unitate','Totalul costurilor fixe','Costul celei mai scumpe unități'],'Firmele compară costul marginal cu venitul adus de acea unitate ca să decidă cât să producă.');
Q('ec75','eco',3,'Veniturile oamenilor cresc. Ce se întâmplă cu cererea pentru un bun normal?',['Crește la orice nivel de preț','Scade','Rămâne la fel','Devine inelastică'],'Întreaga curbă a cererii se deplasează spre dreapta.');
Q('ec76','eco',2,'Ce este privatizarea?',['Trecerea unei companii de stat în proprietate privată','Închiderea unei companii','Preluarea unei firme private de către stat','Listarea unei firme private la bursă'],'Operațiunea inversă, când statul preia o firmă privată, se numește naționalizare.');
Q('ec77','eco',2,'În ce ordine se succed de obicei fazele ciclului economic?',['Expansiune, vârf, recesiune, redresare','Recesiune, vârf, expansiune, criză','Vârf, expansiune, redresare, recesiune','Expansiune, recesiune, vârf, redresare'],'Economia nu crește în linie dreaptă, ci în valuri.');
Q('ec78','eco',3,'Ce face o politică monetară expansionistă?',['Scade dobânzile ca să stimuleze economia','Crește dobânzile ca să reducă inflația','Crește taxele','Reduce cheltuielile publice'],'Credite mai ieftine înseamnă mai multe investiții și mai mult consum.');
Q('ec79','eco',2,'Ce sunt titlurile de stat?',['Împrumuturi pe care le dai statului, în schimbul unei dobânzi','Acțiuni la companii de stat','Taxe plătite în avans','Bilete la loterie'],'Sunt considerate printre cele mai sigure investiții. În România, programele pentru populație se numesc Tezaur și Fidelis.');
Q('ec80','eco',2,'Până la ce sumă sunt garantate depozitele bancare în Uniunea Europeană, pentru fiecare client și fiecare bancă?',['100.000 de euro','10.000 de euro','1 milion de euro','Nu sunt garantate'],'În România, garanția este asigurată de Fondul de Garantare a Depozitelor Bancare (FGDB).');
Q('ec81','eco',2,'O mașină nouă valorează mai puțin după câțiva ani de folosire. Cum se numește această pierdere de valoare?',['Depreciere','Inflație','Dobândă','Dividend'],'Aproape toate bunurile folosite se depreciază. De aceea o mașină nu este o investiție.');
Q('ec82','eco',2,'Ce este salariul minim?',['Cel mai mic salariu pe care un angajator are voie legal să îl plătească','Salariul mediu din economie','Salariul unui începător','Ajutorul de șomaj'],'Este stabilit de stat și se modifică periodic.');
TF('ec83','eco',2,'Dacă o țară tipărește mai mulți bani, toată lumea devine automat mai bogată.',false,'Dacă banii se înmulțesc, dar bunurile nu, cresc doar prețurile. Bogăția vine din ce se produce.');
TF('ec84','eco',2,'Un PIB mai mare înseamnă automat că toți oamenii din țară trăiesc mai bine.',false,'PIB-ul nu arată cum este împărțit venitul și nici calitatea vieții.');
TF('ec85','eco',2,'La un credit cu dobândă variabilă, rata lunară se poate schimba în timp.',true,'Dobânda urmărește un indicator de referință. Dacă acesta crește, crește și rata.');
TF('ec86','eco',2,'Randamentele din trecut ale unei investiții garantează randamentele viitoare.',false,'Trecutul oferă informații, dar nu garanții. Avertismentul apare în orice prospect de investiții.');

Q('bz01','biz',1,'Ce este cifra de afaceri?',['Totalul vânzărilor unei firme într-o perioadă','Profitul firmei','Numărul de angajați','Banii din contul firmei'],'Cifra de afaceri arată cât ai vândut, nu cât ți-a rămas.');
Q('bz02','biz',1,'Cum se calculează profitul?',['Venituri minus cheltuieli','Venituri plus cheltuieli','Venituri împărțite la cheltuieli','Preț înmulțit cu cantitate'],'Dacă cheltuielile sunt mai mari decât veniturile, firma are pierdere.');
Q('bz03','biz',2,'O firmă are venituri de 100.000 de lei și cheltuieli de 80.000. Care este marja de profit?',['20%','25%','80%','120%'],'Profit = 20.000 de lei. Marja = profit / venituri = 20.000 / 100.000.');
